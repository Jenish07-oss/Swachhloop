{% extends "base.html" %}
{% block title %}Manifest Not Found — {{ BRAND }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm border-0 rounded-4">
            <i class="fa-solid fa-triangle-exclamation text-warning fa-3x mb-3"></i>
            <h3 class="fw-bold">Pickup Manifest Not Found</h3>
            <p class="text-muted">No valid pickup record found for ID #{{ pickup_id }}. Please check the QR code or pickup token.</p>
            <a href="{{ url_for('home') }}" class="btn btn-success mt-2">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
